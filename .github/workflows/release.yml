# Builds the Windows installer and publishes it as a GitHub release when a version tag (v0.2.0 ...) is pushed,
# or when the workflow is run by hand on a branch, under the app's version.
# The release also carries latest.json, which the app's updater reads to offer the new version.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # The local .cargo/config.toml points the build output at a folder on the developer's PC.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # A tag push names the release after the tag; a manual run names it after the app's version and
          # creates that tag on the commit it builds.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v__VERSION__' }}
          releaseName: Deadlock BCMA ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v__VERSION__' }}
          releaseBody: Download the setup file below, run it, and the app opens when it is done. Installed copies update themselves.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
